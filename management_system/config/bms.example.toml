# ─────────────────────────────────────────────────────────────────────
#  BMS(경영관리업무시스템) 운영 설정 예시
#  이 파일을 config/bms.toml 로 복사한 뒤 값을 수정하세요. (bms.toml 은 git 에 올리지 않음)
#  같은 서버의 다른 엔진과 겹치지 않도록 포트·폴더·서비스명에 'BMS' 를 사용합니다.
# ─────────────────────────────────────────────────────────────────────

[server]
host = "127.0.0.1"          # 리버스 프록시 사용 시 127.0.0.1 (외부 직접 노출 금지)
port = 8100                 # 다른 엔진과 겹치지 않는 포트
allowed_hosts = ["bms.example.co.kr", "192.168.0.20", "localhost"]
behind_proxy = true         # Caddy/IIS/Nginx 등이 HTTPS 를 처리하는 경우 true
trusted_proxies = ["127.0.0.1"]
# 프록시 없이 직접 HTTPS 할 경우 (behind_proxy=false)
# ssl_certfile = "D:\\BMS\\secrets\\cert.pem"
# ssl_keyfile  = "D:\\BMS\\secrets\\key.pem"

[paths]
data_dir    = "D:\\BMS\\data"            # DB 위치 (BitLocker 적용 드라이브 권장)
secrets_dir = "D:\\BMS\\secrets"         # 암호화 마스터키 (서비스 계정만 읽기 권한)
log_dir     = "D:\\BMS\\logs"
nas_root    = "\\\\192.168.0.10\\BMS"     # NAS 공유 폴더 (BMS 전용 계정·권한)
backup_dir  = "\\\\192.168.0.10\\BMS\\BMS_백업"
# 임직원 서류 폴더: 이 아래에 '성명' 폴더를 만들고 입사서류를 넣으면 등록 초안이 자동 생성되고,
# 계약서·증명서 PDF 도 그 임직원 폴더에 저장됩니다. Windows 서비스로 운영할 때는 Z: 같은 드라이브 문자가
# 보이지 않으므로 반드시 \\\\서버\\공유 형식을 쓰고, 서비스 계정에 읽기/쓰기 권한을 주세요.
employee_root = "\\\\192.168.0.10\\공유폴더\\인사\\BMS"
intake_interval_sec = 60                  # 새 폴더 확인 주기(초), 0 이면 끔

[security]
require_2fa = true
session_idle_minutes = 30
session_max_hours = 10
max_failed_logins = 5
lockout_minutes = 15
password_min_length = 10
password_max_age_days = 90
cookie_secure = "auto"

[mail]
# 전자서명 요청·증명서 전송에 사용. 비밀번호는 여기 넣지 말고 secrets_dir\smtp_password.txt 또는 BMS_SMTP_PASSWORD 환경변수에 둡니다.
smtp_host = ""                   # 비우면 메일 대신 서명 링크를 화면에 표시
smtp_port = 587
smtp_ssl  = false                # true: SMTPS(465), false: STARTTLS(587)
smtp_user = ""
smtp_from = ""
public_url = ""                  # 직원이 메일 링크로 접속할 주소 (HTTPS 필수) 예: https://bms.example.co.kr
sign_valid_days = 7

[pdf]
pdf_browser_channel = "msedge"   # Windows 기본 Edge 로 PDF 변환
pdf_on_signed = true             # 체결완료·발급완료 시 NAS 자동 보관

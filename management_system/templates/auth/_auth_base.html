<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}로그인{% endblock %} - {{ SYSTEM_CODE }} 경영관리시스템</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/static/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="auth-body">
  <div class="auth-card card">
    <div class="card-body p-4">
      <div class="text-center mb-3">
        <i class="bi bi-buildings-fill fs-1 text-primary"></i>
        <div class="fw-bold fs-5">경영관리업무시스템</div>
        <div class="small text-muted">{{ company() }}</div>
      </div>
      {% if msg %}<div class="alert alert-info py-2 small">{{ msg }}</div>{% endif %}
      {% if notice %}<div class="alert alert-warning py-2 small">{{ notice }}</div>{% endif %}
      {% if error %}<div class="alert alert-danger py-2 small"><i class="bi bi-exclamation-triangle me-1"></i>{{ error }}</div>{% endif %}
      {% block content %}{% endblock %}
    </div>
    <div class="card-footer small text-muted text-center">
      <i class="bi bi-shield-lock"></i> 인가된 사용자만 접속할 수 있으며 모든 접속은 기록됩니다.
    </div>
  </div>
  <script nonce="{{ csp_nonce }}" src="/static/js/common.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
